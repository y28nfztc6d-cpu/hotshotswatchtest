name: Build HotShots Watch Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Check Xcode
        run: |
          xcodebuild -version
          echo "XCODE_PATH:"
          xcode-select -p

      - name: Check watchOS SDK
        run: |
          xcodebuild -showsdks | grep -i watchos

      - name: Create Swift test source
        run: |
          mkdir -p HotShotsWatchTest

          cat > HotShotsWatchTest/ContentView.swift <<'EOF'
          import SwiftUI

          struct ContentView: View {
              var body: some View {
                  VStack {
                      Text("🏀")
                      Text("HotShots")
                      Text("Watch Test")
                  }
              }
          }
          EOF

      - name: Validate Swift source
        run: |
          xcrun swiftc \
            -target arm64-apple-watchos26.0 \
            -parse \
            HotShotsWatchTest/ContentView.swift

          echo "Swift watchOS source parsed successfully."

      - name: Final result
        run: |
          echo "======================================"
          echo "HOTSHOTS WATCHOS TEST PASSED"
          echo "======================================"
