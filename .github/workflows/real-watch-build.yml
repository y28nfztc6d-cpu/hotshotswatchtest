name: Real HotShots Watch Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Create HotShots Watch project
        run: |
          mkdir -p HotShotsWatchTest/HotShotsWatchTest

          cat > HotShotsWatchTest/HotShotsWatchTest/HotShotsWatchTestApp.swift <<'EOF'
          import SwiftUI

          @main
          struct HotShotsWatchTestApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat > HotShotsWatchTest/HotShotsWatchTest/ContentView.swift <<'EOF'
          import SwiftUI

          // MARK: - Models

          struct Player: Identifiable, Codable {
              let id: String
              let name: String
              let jerseyNumber: Int?

              enum CodingKeys: String, CodingKey {
                  case id
                  case name
                  case jerseyNumber = "jersey_number"
              }
          }

          enum WorkoutType: String, CaseIterable, Identifiable {
              case court = "Court Shooting"
              case freeThrow = "Free Throws"
              case hotShot = "Hot Shot"

              var id: String { rawValue }

              var icon: String {
                  switch self {
                  case .court:
                      return "basketball.fill"
                  case .freeThrow:
                      return "target"
                  case .hotShot:
                      return "flame.fill"
                  }
              }
          }

          enum ShotResult: String {
              case make
              case miss
          }

          struct ShotState {
              var phase: String
              var spot: Int
              var attempt: Int
              var total: Int
          }

          // MARK: - API

          final class HotShotsAPI {
              static let shared = HotShotsAPI()

              private let baseURL = "https://skilled-hot-shot-track.base44.app"
              
              // Authentication will be supplied by the iPhone/watch handoff.
              // Keeping this separate means we can add WatchConnectivity
              // without rewriting the workout system.
              var accessToken: String?

              private init() {}

              func listPlayers() async throws -> [Player] {
                  guard let url = URL(string: "\(baseURL)/functions/watchListPlayers") else {
                      throw APIError.invalidURL
                  }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  addAuth(to: &request)

                  let (data, response) = try await URLSession.shared.data(for: request)
                  try validate(response)

                  let decoded = try JSONDecoder().decode(PlayerResponse.self, from: data)
                  return decoded.players
              }

              func startSession(
                  playerID: String,
                  workout: WorkoutType
              ) async throws -> StartSessionResponse {
                  guard let url = URL(string: "\(baseURL)/functions/watchStartSession") else {
                      throw APIError.invalidURL
                  }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  addAuth(to: &request)

                  var body: [String: Any] = [
                      "player_id": playerID
                  ]

                  switch workout {
                  case .court:
                      body["session_type"] = "full_shooting"
                      body["shots_per_spot"] = 1
                      body["three_point_distance"] = "19_9"

                  case .freeThrow:
                      body["session_type"] = "free_throw"
                      body["free_throw_count"] = 10

                  case .hotShot:
                      body["session_type"] = "hot_shot"
                      body["hot_shot_num_spots"] = 5
                      body["hot_shot_shots_per_spot"] = 5
                  }

                  request.httpBody = try JSONSerialization.data(
                      withJSONObject: body
                  )

                  let (data, response) = try await URLSession.shared.data(for: request)
                  try validate(response)

                  return try JSONDecoder().decode(
                      StartSessionResponse.self,
                      from: data
                  )
              }

              func recordShot(
                  sessionID: String,
                  playerID: String,
                  state: ShotState,
                  result: ShotResult,
                  shotType: String
              ) async throws -> RecordShotResponse {
                  guard let url = URL(string: "\(baseURL)/functions/watchRecordShot") else {
                      throw APIError.invalidURL
                  }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  addAuth(to: &request)

                  let body: [String: Any] = [
                      "session_id": sessionID,
                      "player_id": playerID,
                      "session_type": state.phase == "free_throw"
                          ? "free_throw"
                          : state.phase == "hot_shot"
                              ? "hot_shot"
                              : "full_shooting",
                      "phase": state.phase,
                      "spot_number": state.spot,
                      "attempt_number": state.attempt,
                      "result": result.rawValue,
                      "shot_type": shotType
                  ]

                  request.httpBody = try JSONSerialization.data(
                      withJSONObject: body
                  )

                  let (data, response) = try await URLSession.shared.data(for: request)
                  try validate(response)

                  return try JSONDecoder().decode(
                      RecordShotResponse.self,
                      from: data
                  )
              }

              private func addAuth(to request: inout URLRequest) {
                  if let accessToken {
                      request.setValue(
                          "Bearer \(accessToken)",
                          forHTTPHeaderField: "Authorization"
                      )
                  }
              }

              private func validate(_ response: URLResponse) throws {
                  guard let http = response as? HTTPURLResponse else {
                      throw APIError.invalidResponse
                  }

                  guard (200...299).contains(http.statusCode) else {
                      throw APIError.serverError(http.statusCode)
                  }
              }
          }

          struct PlayerResponse: Codable {
              let players: [Player]
          }

          struct StartSessionResponse: Codable {
              let sessionID: String
              let sessionType: String
              let sessionNumber: Int
              let next: NextState
              let complete: Bool
              let makes: Int
              let hotShotSpots: [Int]?

              enum CodingKeys: String, CodingKey {
                  case sessionID = "session_id"
                  case sessionType = "session_type"
                  case sessionNumber = "session_number"
                  case next
                  case complete
                  case makes
                  case hotShotSpots = "hot_shot_spots"
              }
          }

          struct RecordShotResponse: Codable {
              let shotID: String
              let next: NextState
              let complete: Bool
              let makes: Int

              enum CodingKeys: String, CodingKey {
                  case shotID = "shot_id"
                  case next
                  case complete
                  case makes
              }
          }

          struct NextState: Codable {
              let phase: String
              let spot: Int
              let attempt: Int
              let total: Int
          }

          enum APIError: Error {
              case invalidURL
              case invalidResponse
              case serverError(Int)
          }

          // MARK: - Main View

          struct ContentView: View {
              @State private var selectedPlayer: Player?
              @State private var players: [Player] = []
              @State private var workout: WorkoutType?
              @State private var showWorkout = false
              @State private var loading = false
              @State private var errorMessage: String?

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 10) {

                              Text("🏀")
                                  .font(.system(size: 34))

                              Text("HotShots")
                                  .font(.headline)

                              Text("Basketball Training")
                                  .font(.caption2)
                                  .foregroundStyle(.secondary)

                              Divider()

                              if let selectedPlayer {
                                  VStack(spacing: 2) {
                                      Text("PLAYER")
                                          .font(.caption2)
                                          .foregroundStyle(.secondary)

                                      Text(selectedPlayer.name)
                                          .font(.headline)
                                  }
                              }

                              if players.isEmpty {
                                  Button {
                                      loadPlayers()
                                  } label: {
                                      Label("Load Players", systemImage: "person.2.fill")
                                  }
                                  .buttonStyle(.borderedProminent)
                              } else {
                                  playerSelector
                              }

                              if selectedPlayer != nil {
                                  workoutMenu
                              }

                              if loading {
                                  ProgressView()
                                      .padding(.top, 4)
                              }

                              if let errorMessage {
                                  Text(errorMessage)
                                      .font(.caption2)
                                      .foregroundStyle(.red)
                                      .multilineTextAlignment(.center)
                              }
                          }
                          .padding(.horizontal, 8)
                      }
                      .navigationDestination(
                          isPresented: $showWorkout
                      ) {
                          if let workout,
                             let selectedPlayer {
                              WorkoutView(
                                  player: selectedPlayer,
                                  workout: workout
                              )
                          }
                      }
                  }
                  .task {
                      loadPlayers()
                  }
              }

              private var playerSelector: some View {
                  VStack(spacing: 5) {
                      Text("SELECT PLAYER")
                          .font(.caption2)
                          .foregroundStyle(.secondary)

                      ForEach(players) { player in
                          Button {
                              selectedPlayer = player
                          } label: {
                              HStack {
                                  Text(player.name)
                                  Spacer()
                                  if selectedPlayer?.id == player.id {
                                      Image(systemName: "checkmark")
                                  }
                              }
                          }
                          .buttonStyle(.bordered)
                      }
                  }
              }

              private var workoutMenu: some View {
                  VStack(spacing: 6) {
                      Text("START TRAINING")
                          .font(.caption2)
                          .foregroundStyle(.secondary)
                          .padding(.top, 4)

                      ForEach(WorkoutType.allCases) { item in
                          Button {
                              workout = item
                              showWorkout = true
                          } label: {
                              HStack(spacing: 8) {
                                  Image(systemName: item.icon)
                                  Text(item.rawValue)
                                      .font(.headline)
                                  Spacer()
                                  Image(systemName: "chevron.right")
                                      .font(.caption)
                              }
                          }
                          .buttonStyle(.borderedProminent)
                      }
                  }
              }

              private func loadPlayers() {
                  loading = true
                  errorMessage = nil

                  Task {
                      do {
                          let result = try await HotShotsAPI.shared.listPlayers()

                          await MainActor.run {
                              players = result

                              if selectedPlayer == nil {
                                  selectedPlayer = result.first
                              }

                              loading = false
                          }
                      } catch {
                          await MainActor.run {
                              loading = false
                              errorMessage =
                                  "Player connection is not ready yet."
                          }
                      }
                  }
              }
          }

          // MARK: - Workout View

          struct WorkoutView: View {
              let player: Player
              let workout: WorkoutType

              @Environment(\.dismiss) private var dismiss

              @State private var sessionID = ""
              @State private var state: ShotState?
              @State private var makes = 0
              @State private var loading = true
              @State private var complete = false
              @State private var errorMessage: String?

              var body: some View {
                  ScrollView {
                      VStack(spacing: 8) {

                          Text(workout.rawValue)
                              .font(.headline)

                          Text(player.name)
                              .font(.caption)
                              .foregroundStyle(.secondary)

                          if loading {
                              ProgressView("Starting...")
                          } else if complete {
                              completionView
                          } else if let state {
                              shotView(state)
                          }

                          if let errorMessage {
                              Text(errorMessage)
                                  .font(.caption2)
                                  .foregroundStyle(.red)
                                  .multilineTextAlignment(.center)
                          }
                      }
                      .padding(.horizontal, 8)
                  }
                  .task {
                      await startWorkout()
                  }
              }

              private func shotView(_ state: ShotState) -> some View {
                  VStack(spacing: 8) {

                      if workout == .court || workout == .hotShot {
                          Text(state.phase == "hot_shot"
                               ? "HOT SHOT"
                               : "SPOT \(state.spot)")
                              .font(.title3)
                              .bold()
                      } else {
                          Text("FREE THROW")
                              .font(.title3)
                              .bold()
                      }

                      Text("Shot \(state.attempt) of \(state.total)")
                          .font(.caption)

                      Text("\(makes)")
                          .font(.system(size: 30, weight: .bold))

                      Text("MAKES")
                          .font(.caption2)
                          .foregroundStyle(.secondary)

                      Button {
                          record(.make)
                      } label: {
                          Text("MAKE")
                              .font(.system(size: 20, weight: .bold))
                              .frame(maxWidth: .infinity)
                      }
                      .buttonStyle(.borderedProminent)
                      .tint(.green)

                      Button {
                          record(.miss)
                      } label: {
                          Text("MISS")
                              .font(.system(size: 20, weight: .bold))
                              .frame(maxWidth: .infinity)
                      }
                      .buttonStyle(.borderedProminent)
                      .tint(.red)
                  }
              }

              private var completionView: some View {
                  VStack(spacing: 8) {
                      Image(systemName: "checkmark.circle.fill")
                          .font(.system(size: 36))
                          .foregroundStyle(.green)

                      Text("WORKOUT COMPLETE")
                          .font(.headline)

                      Text("\(makes) makes")
                          .font(.title3)
                          .bold()

                      Button("Done") {
                          dismiss()
                      }
                      .buttonStyle(.borderedProminent)
                  }
              }

              private func startWorkout() async {
                  do {
                      let result = try await HotShotsAPI.shared.startSession(
                          playerID: player.id,
                          workout: workout
                      )

                      await MainActor.run {
                          sessionID = result.sessionID

                          state = ShotState(
                              phase: result.next.phase,
                              spot: result.next.spot,
                              attempt: result.next.attempt,
                              total: result.next.total
                          )

                          makes = result.makes
                          complete = result.complete
                          loading = false
                      }
                  } catch {
                      await MainActor.run {
                          loading = false
                          errorMessage =
                              "Could not start workout. Authentication still needs to be connected."
                      }
                  }
              }

              private func record(_ result: ShotResult) {
                  guard let current = state else { return }

                  // Immediately disable the current shot by clearing state.
                  // This prevents a double-tap from recording two shots.
                  state = nil

                  Task {
                      do {
                          let shotType: String

                          switch workout {
                          case .freeThrow:
                              shotType = "ft"
                          case .court, .hotShot:
                              shotType = "fg"
                          }

                          let response =
                              try await HotShotsAPI.shared.recordShot(
                                  sessionID: sessionID,
                                  playerID: player.id,
                                  state: current,
                                  result: result,
                                  shotType: shotType
                              )

                          await MainActor.run {
                              makes = response.makes

                              if response.complete {
                                  complete = true
                              } else {
                                  state = ShotState(
                                      phase: response.next.phase,
                                      spot: response.next.spot,
                                      attempt: response.next.attempt,
                                      total: response.next.total
                                  )
                              }
                          }
                      } catch {
                          await MainActor.run {
                              state = current
                              errorMessage = "Shot was not recorded."
                          }
                      }
                  }
              }
          }
          EOF

          cat > HotShotsWatchTest/HotShotsWatchTest/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>HotShots</string>
              <key>CFBundleIdentifier</key>
              <string>com.hotshots.watchtest</string>
              <key>CFBundleName</key>
              <string>HotShots</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>WKApplication</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create Xcode project
        run: |
          brew install xcodegen

          cat > HotShotsWatchTest/project.yml <<'EOF'
          name: HotShotsWatchTest

          options:
            bundleIdPrefix: com.hotshots

          targets:
            HotShotsWatchTest:
              type: application
              platform: watchOS
              deploymentTarget: "26.0"
              sources:
                - HotShotsWatchTest
              info:
                path: HotShotsWatchTest/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hotshots.watchtest
                  CODE_SIGNING_ALLOWED: NO
          EOF

          cd HotShotsWatchTest
          xcodegen generate

      - name: Build real HotShots Watch app
        run: |
          xcodebuild \
            -project HotShotsWatchTest/HotShotsWatchTest.xcodeproj \
            -scheme HotShotsWatchTest \
            -sdk watchsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate built Watch app
        run: |
          echo "Built applications:"
          find ~/Library/Developer/Xcode/DerivedData \
            -name "*.app" \
            -type d \
            -print

      - name: Success
        run: |
          echo "======================================"
          echo "HOTSHOTS WATCH APP BUILD PASSED"
          echo "======================================"
